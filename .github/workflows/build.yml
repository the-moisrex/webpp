name: Build

on:
  push:
    branches:
      - dev
      - main
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - ".agents/**"
      - ".github/ISSUE_TEMPLATE/**"
  pull_request:
    branches:
      - dev
      - main
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - ".agents/**"
      - ".github/ISSUE_TEMPLATE/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # The ubuntu-26.04 runner image already ships gcc/g++ 13-15, clang/clang++ 20-22,
  # CMake and Ninja; ccache and libgtest-dev are not preinstalled. libgtest-dev
  # provides the prebuilt libgtest.a that every test links against (-lgtest) while
  # WEBPP_USE_GTEST stays OFF.
  APT_PACKAGES: ccache libgtest-dev zlib1g-dev

jobs:
  generated:
    name: Check generated files
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Install tools dependencies
        working-directory: tools
        run: npm ci
      - name: Regenerate presets
        working-directory: tools
        run: node reload-build-presets.mjs
      - name: Verify CMakePresets.json is up to date
        run: git diff --exit-code -- CMakePresets.json

  format:
    name: clang-format
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install clang-format (pinned to the version used by contributors)
        run: |
          python3 -m pip install --user clang-format==23.1.1 2>/dev/null \
            || python3 -m pip install --user --break-system-packages clang-format==23.1.1
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          clang-format --version
      - name: Check changed C/C++ files
        run: |
          mapfile -t files < <(git diff --name-only --diff-filter=ACMR "origin/${{ github.base_ref }}...HEAD" -- \
            '*.c' '*.cc' '*.cpp' '*.cxx' '*.h' '*.hh' '*.hpp' '*.hxx')
          if [ "${#files[@]}" -gt 0 ]; then
            printf 'Checking:\n%s\n' "${files[@]}"
            clang-format --dry-run -Werror "${files[@]}"
          else
            echo "No C/C++ files changed."
          fi

  build-and-test:
    name: ${{ matrix.name }}
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: gcc
            cc: gcc-15
            cxx: g++-15
          - name: clang
            cc: clang-22
            cxx: clang++-22
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 1G
      CPM_SOURCE_CACHE: ${{ github.workspace }}/.cpm-cache
    steps:
      - uses: actions/checkout@v7
      - name: Setup build environment
        uses: ./.github/actions/setup-build
        with:
          cache-key: ${{ matrix.name }}
      - name: Configure
        run: >-
          cmake --preset ci
          -DCMAKE_C_COMPILER=${{ matrix.cc }}
          -DCMAKE_CXX_COMPILER=${{ matrix.cxx }}
      - name: Build all tests
        run: cmake --build --preset tests
      - name: Run all tests
        run: ctest --preset tests --parallel "$(nproc)"
      - name: ccache statistics
        if: always()
        run: ccache -s || true
      - name: Upload test logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-logs-${{ matrix.name }}
          path: build/Testing/
          if-no-files-found: ignore

  examples:
    name: examples
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 1G
      CPM_SOURCE_CACHE: ${{ github.workspace }}/.cpm-cache
    steps:
      - uses: actions/checkout@v7
      - name: Setup build environment
        uses: ./.github/actions/setup-build
        with:
          cache-key: gcc
      - name: Configure
        run: >-
          cmake --preset ci
          -DCMAKE_C_COMPILER=gcc-15
          -DCMAKE_CXX_COMPILER=g++-15
      - name: Build all examples
        run: cmake --build --preset examples -- -k 0

  benchmarks:
    name: benchmarks
    # Benchmarks are noisy and slow; only run them for pushes (dev/main) or manual runs, not on PRs.
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 1G
      CPM_SOURCE_CACHE: ${{ github.workspace }}/.cpm-cache
    steps:
      - uses: actions/checkout@v7
      - name: Setup build environment
        uses: ./.github/actions/setup-build
        with:
          cache-key: gcc
      - name: Configure
        run: >-
          cmake --preset ci
          -DCMAKE_C_COMPILER=gcc-15
          -DCMAKE_CXX_COMPILER=g++-15
      - name: Build all benchmarks
        run: cmake --build --preset benchmarks
      - name: Run all benchmarks
        run: ./build/webpp-benchmarks
